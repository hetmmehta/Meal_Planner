<div class="list-header">
  <h1>🍽️ Recipe & Meal Planner</h1>
  <button class="add-btn" routerLink="/add-recipe">➕ Add Recipe</button>
</div>

<div *ngIf="loading" class="loading">Loading recipes...</div>
<div *ngIf="error" class="error">Error: {{ error.message }}</div>

<div *ngIf="!loading && recipes.length > 0" class="recipe-container">
  <div
    *ngFor="let recipe of recipes"
    class="recipe-card"
    (click)="viewRecipe(recipe.id)"
  >
    <img
      *ngIf="recipe.imageUrl"
      [src]="recipe.imageUrl"
      alt="{{ recipe.title }}"
      class="recipe-img"
    />
    <div class="recipe-info">
      <h3>{{ recipe.title }}</h3>
    </div>
    <button class="delete-icon" (click)="deleteRecipe(recipe.id, $event)">✖</button>
  </div>
</div>

<div *ngIf="!loading && recipes.length === 0" class="empty">
  No recipes found.
</div>

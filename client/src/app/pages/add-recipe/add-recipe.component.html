<div class="add-recipe-container">
  <button class="back-btn" routerLink="/">⬅ Back</button>
  <h2>➕ Add New Recipe</h2>

  <div class="card">
    <form (ngSubmit)="onSubmit()" #recipeForm="ngForm">
      <!-- Image Upload & Preview -->
      <div class="form-group image-upload">
        <label for="image">Recipe Image</label>
        <div class="image-preview" *ngIf="imagePreview; else noImage">
          <img [src]="imagePreview" alt="Recipe preview" />
        </div>
        <ng-template #noImage>
          <div class="no-image">No image selected</div>
        </ng-template>

        <input
          type="file"
          accept="image/*"
          (change)="onFileSelected($event)"
          class="file-input"
        />
        <input
          type="text"
          id="imageUrl"
          name="imageUrl"
          [(ngModel)]="recipe.imageUrl"
          class="form-control"
          placeholder="Or paste image URL"
        />
      </div>

      <!-- Title -->
      <div class="form-group">
        <label for="title">Title</label>
        <input
          type="text"
          id="title"
          name="title"
          class="form-control"
          [(ngModel)]="recipe.title"
          required
        />
      </div>

      <!-- Description -->
      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          name="description"
          class="form-control"
          [(ngModel)]="recipe.description"
          rows="3"
        ></textarea>
      </div>

      <!-- Category -->
      <div class="form-group">
        <label for="category">Category</label>
        <select
          id="category"
          name="category"
          class="form-control"
          [(ngModel)]="recipe.category"
        >
          <option value="">-- Select Category --</option>
          <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
        </select>
      </div>

      <!-- Cook Time -->
      <div class="form-group">
        <label for="cookTime">Cook Time (minutes)</label>
        <input
          type="number"
          id="cookTime"
          name="cookTime"
          class="form-control"
          [(ngModel)]="recipe.cookTime"
        />
      </div>

      <!-- Ingredients -->
      <div class="form-group">
        <label>Ingredients</label>
        <div
          *ngFor="let ingredient of recipe.ingredients; let i = index"
          class="ingredient-row"
        >
          <input
            type="text"
            class="form-control"
            [(ngModel)]="recipe.ingredients[i]"
            name="ingredient-{{ i }}"
            (input)="onIngredientChange(i, $any($event.target).value)"
          />
          <button
            type="button"
            (click)="removeIngredient(i)"
            class="btn btn-danger btn-sm"
          >
            ✖
          </button>
        </div>
        <button
          type="button"
          class="btn btn-secondary"
          (click)="addIngredient()"
        >
          + Add Ingredient
        </button>
      </div>

      <!-- Steps -->
      <div class="form-group">
        <label>Steps</label>
        <div
          *ngFor="let step of recipe.steps; let i = index"
          class="step-row"
        >
          <textarea
            class="form-control"
            [(ngModel)]="recipe.steps[i]"
            name="step-{{ i }}"
            rows="2"
            (input)="onStepChange(i, $any($event.target).value)"
          ></textarea>
          <button
            type="button"
            (click)="removeStep(i)"
            class="btn btn-danger btn-sm"
          >
            ✖
          </button>
        </div>
        <button type="button" class="btn btn-secondary" (click)="addStep()">
          + Add Step
        </button>
      </div>

      <button type="submit" class="btn btn-primary mt-3">Add Recipe</button>
    </form>
  </div>

  <div *ngIf="successMsg" class="success-msg mt-2">
    {{ successMsg }}
  </div>
</div>
